    <text x="164" y="126" fill="#5C645D" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">1. Capture</text>
    <text x="110" y="167" fill="#121412" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">Watch the day</text>
    <text x="110" y="194" fill="#5C645D" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Screen, audio, and app context stay</text>
    <text x="110" y="214" fill="#5C645D" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">searchable on the device by default.</text>
  </g>

  <path d="M332 160H402" stroke="#97AA9D" stroke-width="4" stroke-linecap="round"/>
  <path d="M390 148L402 160L390 172" stroke="#97AA9D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g>
    <rect x="424" y="92" width="232" height="136" rx="28" fill="#FFFDF9" stroke="#DAD3C8"/>
    <circle cx="478" cy="138" r="24" fill="#E8ECE3"/>
    <path d="M468 145C474 137 483 133 492 133" stroke="url(#ink)" stroke-width="4" stroke-linecap="round"/>
    <path d="M468 157C476 149 487 145 498 145" stroke="url(#ink)" stroke-width="4" stroke-linecap="round"/>
    <text x="516" y="126" fill="#5C645D" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">2. Understand</text>
    <text x="462" y="167" fill="#121412" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">Spot patterns</text>
    <text x="462" y="194" fill="#5C645D" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">The app looks for repeated routines,</text>
    <text x="462" y="214" fill="#5C645D" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">handoffs, and hidden admin loops.</text>
  </g>

  <path d="M684 160H754" stroke="#97AA9D" stroke-width="4" stroke-linecap="round"/>
  <path d="M742 148L754 160L742 172" stroke="#97AA9D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g>
    <rect x="776" y="92" width="232" height="136" rx="28" fill="#FFFDF9" stroke="#DAD3C8"/>
    <circle cx="830" cy="138" r="24" fill="#E8ECE3"/>
    <rect x="817" y="126" width="26" height="24" rx="8" fill="url(#ink)"/>
    <text x="868" y="126" fill="#5C645D" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">3. Suggest</text>
    <text x="814" y="167" fill="#121412" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">Draft safely</text>
    <text x="814" y="194" fill="#5C645D" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Suggestions arrive with evidence and</text>
    <text x="814" y="214" fill="#5C645D" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">stay reviewable before you enable them.</text>
  </g>

  <path d="M1036 160H1106" stroke="#97AA9D" stroke-width="4" stroke-linecap="round"/>
  <path d="M1094 148L1106 160L1094 172" stroke="#97AA9D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

