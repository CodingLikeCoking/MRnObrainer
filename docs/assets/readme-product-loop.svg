<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="surface" x1="120" y1="32" x2="1160" y2="288" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBF7F0"/>
      <stop offset="1" stop-color="#EEF1EA"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#18211D"/>
      <stop offset="1" stop-color="#5B796D"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" rx="32" fill="url(#surface)"/>
  <rect x="24" y="24" width="1232" height="272" rx="24" stroke="#D9D6CE"/>

  <g>
    <rect x="72" y="92" width="232" height="136" rx="28" fill="#FFFDF9" stroke="#DAD3C8"/>
    <circle cx="126" cy="138" r="24" fill="#E8ECE3"/>
