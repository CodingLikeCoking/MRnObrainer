    <text x="1176" y="126" text-anchor="middle" fill="#C8D2C8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">4. Run</text>
    <text x="1176" y="168" text-anchor="middle" fill="#FFFDF8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">This Mac</text>
