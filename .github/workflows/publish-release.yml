name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 2.0.429). Leave empty for latest in Cargo.toml."
        required: false
        type: string
      channel:
        description: "Channel to publish"
        required: true
        type: choice
        options:
          - stable
          - beta
          - both
        default: stable

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version and tags
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(grep '^version = ' apps/mrnobrainer-app/src-tauri/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "STABLE_TAG=v${VERSION}" >> "$GITHUB_ENV"
          echo "BETA_TAG=v${VERSION}-beta" >> "$GITHUB_ENV"
          echo "Publishing v${VERSION} to ${{ github.event.inputs.channel }}"

      - name: Verify artifacts exist on R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          VERSION="${{ env.VERSION }}"
          echo "=== Checking R2 for v${VERSION} ==="
          FOUND=0
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc; do
            COUNT=$(aws s3 ls "s3://screenpipe-releases/releases/${VERSION}/${target}/" \
              --endpoint-url "$R2_ENDPOINT" 2>/dev/null | wc -l || echo 0)
            if [ "$COUNT" -gt 0 ]; then
              echo "✅ ${target}: ${COUNT} files"
              FOUND=$((FOUND + 1))
            else
              echo "⚠️  ${target}: no artifacts"
            fi
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "❌ No artifacts found for v${VERSION} on R2"
            exit 1
          fi
          echo "Found artifacts for ${FOUND}/3 platforms"

      - name: Publish stable GitHub release + latest.json
        if: github.event.inputs.channel == 'stable' || github.event.inputs.channel == 'both'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${{ env.VERSION }}"
          TAG="${{ env.STABLE_TAG }}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          export TAG
          ASSET_ROOT="/tmp/release-assets/stable"
          mkdir -p "$ASSET_ROOT"

          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc; do
            mkdir -p "${ASSET_ROOT}/${target}"
            aws s3 cp "s3://screenpipe-releases/releases/${VERSION}/${target}/" "${ASSET_ROOT}/${target}/" \
              --recursive \
              --exclude "*" \
              --include "*.dmg" \
              --include "*.tar.gz" \
              --include "*.sig" \
              --include "*.exe" \
              --include "*.nsis.zip" \
              --endpoint-url "$R2_ENDPOINT" 2>/dev/null || true
          done

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$REPO" \
              --title "MRnObrainer v${VERSION}" \
              --notes "Automated stable release for MRnObrainer v${VERSION}."
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "MRnObrainer v${VERSION}" \
              --notes "Automated stable release for MRnObrainer v${VERSION}."
          fi

          python3 <<'PY'
          import pathlib, os, subprocess

          root = pathlib.Path("/tmp/release-assets/stable")
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]

          files = sorted(p for p in root.rglob("*") if p.is_file())
          for file_path in files:
              target = file_path.parent.name
              upload_name = f"{target}-{file_path.name}"
              subprocess.run(
                  ["gh", "release", "upload", tag, f"{file_path}#{upload_name}", "--repo", repo, "--clobber"],
                  check=True,
              )
          PY

          export TAG REPO PUB_DATE VERSION
          python3 <<'PY'
          import glob, json, os

          version = os.environ["VERSION"]
          pub_date = os.environ["PUB_DATE"]
          repo = os.environ["REPO"]
          tag = os.environ["TAG"]

          target_map = {
              "aarch64-apple-darwin": "darwin-aarch64",
              "x86_64-apple-darwin": "darwin-x86_64",
              "x86_64-pc-windows-msvc": "windows-x86_64",
          }

          platforms = {}
          for target, platform_key in target_map.items():
              sig_dir = f"/tmp/release-assets/stable/{target}"
              sig_files = glob.glob(f"{sig_dir}/*.sig")
              if not sig_files:
                  continue
              stable_sigs = [f for f in sig_files if "beta" not in os.path.basename(f)]
              sig_file = stable_sigs[0] if stable_sigs else sig_files[0]
              with open(sig_file, "r", encoding="utf-8") as handle:
                  signature = handle.read().strip()
              artifact = os.path.basename(sig_file).replace(".sig", "")
              upload_name = f"{target}-{artifact}"
              platforms[platform_key] = {
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{upload_name}",
                  "signature": signature,
              }

          data = {
              "version": version,
              "pub_date": pub_date,
              "platforms": platforms,
          }
          with open("/tmp/latest.json", "w", encoding="utf-8") as handle:
              json.dump(data, handle, indent=2)
          print(json.dumps(data, indent=2))
          PY

      - name: Publish beta GitHub release + latest.json
        if: github.event.inputs.channel == 'beta' || github.event.inputs.channel == 'both'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${{ env.VERSION }}"
          TAG="${{ env.BETA_TAG }}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          export TAG
          ASSET_ROOT="/tmp/release-assets/beta"
          mkdir -p "$ASSET_ROOT"

          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc; do
            mkdir -p "${ASSET_ROOT}/${target}"
            aws s3 cp "s3://screenpipe-releases/beta/releases/${VERSION}/${target}/" "${ASSET_ROOT}/${target}/" \
              --recursive \
              --exclude "*" \
              --include "*.dmg" \
              --include "*.tar.gz" \
              --include "*.sig" \
              --include "*.exe" \
              --include "*.nsis.zip" \
              --endpoint-url "$R2_ENDPOINT" 2>/dev/null || true
          done

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$REPO" \
              --title "MRnObrainer Beta v${VERSION}" \
              --notes "Automated beta release for MRnObrainer v${VERSION}." \
              --prerelease
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "MRnObrainer Beta v${VERSION}" \
              --notes "Automated beta release for MRnObrainer v${VERSION}." \
              --prerelease
          fi

          python3 <<'PY'
          import pathlib, os, subprocess

          root = pathlib.Path("/tmp/release-assets/beta")
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]

          files = sorted(p for p in root.rglob("*") if p.is_file())
          for file_path in files:
              target = file_path.parent.name
              upload_name = f"{target}-{file_path.name}"
              subprocess.run(
                  ["gh", "release", "upload", tag, f"{file_path}#{upload_name}", "--repo", repo, "--clobber"],
                  check=True,
              )
          PY

          export TAG REPO PUB_DATE VERSION
          python3 <<'PY'
          import glob, json, os

          version = os.environ["VERSION"]
          pub_date = os.environ["PUB_DATE"]
          repo = os.environ["REPO"]
          tag = os.environ["TAG"]

          target_map = {
              "aarch64-apple-darwin": "darwin-aarch64",
              "x86_64-apple-darwin": "darwin-x86_64",
              "x86_64-pc-windows-msvc": "windows-x86_64",
          }

          platforms = {}
          for target, platform_key in target_map.items():
              sig_dir = f"/tmp/release-assets/beta/{target}"
              sig_files = glob.glob(f"{sig_dir}/*.sig")
              if not sig_files:
                  continue
              beta_sigs = [f for f in sig_files if "beta" in os.path.basename(f)]
              sig_file = beta_sigs[0] if beta_sigs else sig_files[0]
              with open(sig_file, "r", encoding="utf-8") as handle:
                  signature = handle.read().strip()
              artifact = os.path.basename(sig_file).replace(".sig", "")
              upload_name = f"{target}-{artifact}"
              platforms[platform_key] = {
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{upload_name}",
                  "signature": signature,
              }

          data = {
              "version": version,
              "pub_date": pub_date,
              "platforms": platforms,
          }
          with open("/tmp/beta-latest.json", "w", encoding="utf-8") as handle:
              json.dump(data, handle, indent=2)
          print(json.dumps(data, indent=2))
          PY

      - name: Publish updater manifests branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          TMP_REPO="$(mktemp -d)"
          trap 'rm -rf "$TMP_REPO"' EXIT

          git init "$TMP_REPO"
          cd "$TMP_REPO"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          if git fetch --depth 1 origin updater-manifests; then
            git checkout -b updater-manifests FETCH_HEAD
          else
            git checkout --orphan updater-manifests
          fi

          mkdir -p updates/stable updates/beta

          if [ -f /tmp/latest.json ]; then
            cp /tmp/latest.json updates/stable/latest.json
          fi

          if [ -f /tmp/beta-latest.json ]; then
            cp /tmp/beta-latest.json updates/beta/latest.json
          fi

          cat > README.md <<'EOF'
          # MRnObrainer updater manifests

          This branch is machine-managed by the publish-release workflow.
          It hosts the signed updater JSON consumed by the desktop app.
          EOF

          git add README.md updates
          if git diff --cached --quiet; then
            echo "No manifest changes to publish"
            exit 0
          fi

          git commit -m "Update MRnObrainer updater manifests for v${{ env.VERSION }}"
          git push origin updater-manifests
