name: OSS Security Surface

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-secrets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tooling
        run: python -m pip install --disable-pip-version-check detect-secrets==1.5.0

      - name: Validate the OSS surface
        run: python .github/scripts/validate_open_source_surface.py

      - name: Scan the OSS surface against the baseline
        shell: bash
        run: |
          git ls-files -z \
            | python .github/scripts/filter_detect_secrets_paths.py \
            | xargs -0 detect-secrets-hook --baseline .secrets.baseline
