repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: >-
          (^ee/|^apps/mrnobrainer-app/src-tauri/gen/|^apps/mrnobrainer-app/src-tauri/icons/|^apps/mrnobrainer-app/src-tauri/assets/|(^|/)(node_modules|target|dist|out)/|\.lock$|\.png$|\.svg$|\.ico$|\.icns$|\.wav$)
        args:
          - --baseline
          - .secrets.baseline
